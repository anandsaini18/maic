name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub releases

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ── Resolve release version and short-circuit if already released ─────────────
  prepare:
    name: "Prepare Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      already_released: ${{ steps.tagcheck.outputs.already_released }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from pyproject.toml
        id: version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tagcheck
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Verify CI is green before releasing ───────────────────────────────────
  verify:
    name: "Verify CI"
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app/ tests/
          black --check app/ tests/
          mypy app/

      - name: Test
        run: pytest --tb=short -q

  # ── Build frontend + Python distribution ──────────────────────────────────
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [prepare, verify]
    if: needs.prepare.outputs.already_released != 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build Python distribution
        run: |
          pip install build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Create GitHub Release with changelog excerpt ───────────────────────────
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.already_released != 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create version tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      # Extract the section for this version from CHANGELOG.md.
      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Pull the block between this version header and the next ## header
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section found for $VERSION in CHANGELOG.md"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Maic v${{ needs.prepare.outputs.version }}"
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false

  # ── Publish to PyPI ────────────────────────────────────────────────────────
  pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [prepare, github-release]
    if: needs.prepare.outputs.already_released != 'true'
    environment: pypi  # requires a GitHub environment named "pypi" with PYPI_API_TOKEN secret
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
