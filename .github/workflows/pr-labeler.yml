name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # ── Path-based Labels ──────────────────────────────────────────────────────
  path-labeler:
    name: "Apply Path Labels"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply labels based on changed paths
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  # ── PR Size Label ──────────────────────────────────────────────────────────
  size-labeler:
    name: "Apply Size Label"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply PR size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size: XS"
          xs_max_size: 9
          s_label: "size: S"
          s_max_size: 49
          m_label: "size: M"
          m_max_size: 199
          l_label: "size: L"
          l_max_size: 499
          xl_label: "size: XL"
          fail_if_xl: false
          message_if_xl: >
            This PR is quite large (500+ lines changed). Consider splitting it
            into smaller, focused PRs for easier review.
