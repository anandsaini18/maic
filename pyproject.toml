[project]
name = "maic"
version = "0.1.0"
description = "OpenAI-compatible REST API for local MLX models on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "psutil>=6.0.0",
    "huggingface_hub>=0.23.0",
    "hf-transfer>=0.1.8",
    "psycopg2-binary>=2.9.11"
]

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.21.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maic*"]

[project.scripts]
maic = "maic.cli:main"

# ── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=maic",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, real dependencies)",
    "security: Security-related tests",
    "slow: Tests that take significant time to run",
]
minversion = "7.4"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "__pycache__", "*.egg-info", ".pytest_cache"]
timeout = 30
asyncio_mode = "auto"

# ── ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["maic"]

# ── black ────────────────────────────────────────────────────────────────────

[tool.black]
target-version = ["py310"]
line-length = 100

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*", "huggingface_hub.*", "hf_transfer.*", "psutil.*"]
ignore_missing_imports = true
